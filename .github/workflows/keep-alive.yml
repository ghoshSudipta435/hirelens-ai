name: Keep Alive Ping

on:
  schedule:
    # Run every 14 minutes to prevent Render free tier from spinning down (spins down after 15 mins of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        run: |
          curl -f -s -o /dev/null -w "%{http_code}\n" https://hirelens-backend-l21e.onrender.com/health || echo "Backend ping failed"

      - name: Ping Frontend
        run: |
          curl -f -s -o /dev/null -w "%{http_code}\n" https://hirelens-ai-frontend.vercel.app || echo "Frontend ping failed"
